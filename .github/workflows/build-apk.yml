name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VER_OUTPUT"

          JAVA_MAJOR=$(echo "$JAVA_VER_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse Java major version from '$JAVA_VER_OUTPUT'."
            exit 1
          fi

          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but found Java $JAVA_MAJOR."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "Checking debug.keystore..."
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore was not created."
            exit 1
          fi
          echo "debug.keystore is present and verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Verifying debug APK at: $EXPECTED_APK"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK!"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK exists but is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension."; exit 1 ;;
          esac

          echo "APK successfully verified:"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP}/apk-release-asset"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}' | tr -cd 'a-zA-Z0-9._-')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          cp -v "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty."
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          cat << 'EOF' > release_notes.md
          ### Arushi AI - Debug APK Build

          This is an automatically generated debug APK build created by GitHub Actions.

          - **Build Run Number:** ${{ github.run_number }}
          - **Build Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** `${{ github.sha }}`
          - **Asset Name:** `${{ steps.prepare_asset.outputs.asset_name }}`

          > **Note for testing:**
          > - This APK is intended for testing and development purposes.
          > - This is not a Play Store production release.
          > - The APK is signed with a temporary Android debug keystore.
          > - Direct APK download is available under the **Assets** section below.
          EOF

          echo "Creating release $RELEASE_TAG with asset $ASSET_PATH..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "$TARGET_COMMIT" \
            --latest

          rm -f release_notes.md
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Build & Release Status Report ==="
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="${{ steps.publish_release.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.publish_release.outputs.release_title }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Asset Filename: $ASSET_NAME"
            
            RELEASE_URL=""
            if command -v gh >/dev/null 2>&1; then
              RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || true)
            fi
            if [ -z "$RELEASE_URL" ]; then
              RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            fi
            echo "Release URL: $RELEASE_URL"

            {
              echo "## 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release:** [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Downloadable APK Asset:** \`$ASSET_NAME\`"
              echo ""
              echo "📥 **Direct Download:** The APK file \`$ASSET_NAME\` is ready to download directly on your phone from the **Assets** section of the [Release Page]($RELEASE_URL)."
              echo ""
              echo "📦 **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK build and artifact upload completed successfully."
            echo "The Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` (Available on this run page)"
              echo ""
              echo "> **Notice:** Automatic publishing to GitHub Releases encountered an error or lacked permissions, but the compiled APK was preserved as a workflow artifact named \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
